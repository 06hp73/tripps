<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tripps — cheapest way across Sweden</title>
<style>
  :root {
    --bg: #fbfaf8; --fg: #1c1b1a; --muted: #6b6764; --line: #e3e0dc;
    --card: #ffffff; --accent: #1d6f52; --warn: #8a5a1a; --warn-bg: #fdf6e9;
    --free: #1d6f52; --free-bg: #eaf5ef;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16150f; --fg: #edeae4; --muted: #9b958d; --line: #33312b;
      --card: #1f1e18; --accent: #6fbf95; --warn: #d9a441; --warn-bg: #2a2317;
      --free: #6fbf95; --free-bg: #1b2a22;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 60rem; margin: 0 auto; padding: 2rem 1.25rem 5rem; }
  h1 { font-size: 1.9rem; margin: 0 0 .25rem; letter-spacing: -.02em; }
  .tagline { color: var(--muted); margin: 0 0 2rem; }
  form {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 1.25rem; display: grid; gap: 1rem;
    grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
  }
  form > div { position: relative; }
  label { display: block; font-size: .8rem; text-transform: uppercase;
          letter-spacing: .04em; color: var(--muted); margin-bottom: .35rem; }
  .suggest {
    position: absolute; z-index: 20; left: 0; right: 0; top: 100%; margin: .25rem 0 0;
    list-style: none; padding: .25rem; background: var(--card); color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18);
    max-height: 16rem; overflow-y: auto;
  }
  .suggest li {
    padding: .5rem .6rem; border-radius: 5px; cursor: pointer; font-size: .95rem;
  }
  .suggest li[aria-selected="true"], .suggest li:hover { background: var(--accent); color: #fff; }
  input[type=text], input[type=date], input[type=time], input[type=number] {
    width: 100%; padding: .55rem .65rem; border: 1px solid var(--line);
    border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit;
  }
  .checks { display: flex; gap: 1.25rem; align-items: center; flex-wrap: wrap; }
  .checks label { text-transform: none; letter-spacing: 0; font-size: .95rem;
                  color: var(--fg); margin: 0; display: flex; gap: .45rem; align-items: center; }
  .checks-label { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em;
                  color: var(--muted); align-self: center; margin-right: .25rem; }
  .full { grid-column: 1 / -1; }
  button {
    padding: .7rem 1.4rem; border: 0; border-radius: 6px; background: var(--accent);
    color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: progress; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); margin-left: .5rem; }
  .opt { text-transform: none; color: var(--muted); font-weight: 400; letter-spacing: 0; }
  .fare-cal { display: grid; gap: .5rem; grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr)); }
  .fare-day { border: 1px solid var(--line); border-radius: 8px; padding: .6rem .7rem; background: var(--card); }
  .fare-day[role=button] { cursor: pointer; transition: border-color .1s, transform .05s; }
  .fare-day[role=button]:hover { border-color: var(--accent); }
  .fare-day.open { border-color: var(--accent); border-width: 2px; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  .fare-day.best { border-color: var(--accent); border-width: 2px; }
  .fare-day.disabled { opacity: .5; }
  .fare-day .d { font-size: .8rem; color: var(--muted); }
  .fare-day .p { font-size: 1.25rem; font-weight: 700; }
  .fare-day .m { font-size: .8rem; color: var(--muted); }
  .fare-day .hint { font-size: .68rem; color: var(--accent); margin-top: .35rem; }
  /* Itineraries rendered client-side (round-trip, fare detail) share the server partial's look. */
  .itin { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.15rem; margin-bottom: 1rem; }
  .itin .head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-bottom: .5rem; }
  .itin .price { font-size: 1.4rem; font-weight: 700; letter-spacing: -.02em; }
  .itin .meta { color: var(--muted); font-size: .9rem; }
  .itin .legs { list-style: none; margin: 0; padding: 0; }
  .itin .legs li { padding: .4rem 0; border-top: 1px solid var(--line); font-size: .92rem; }
  a.book { color: var(--accent); text-decoration: none; font-weight: 600; }
  a.book:hover { text-decoration: underline; }
  .rt-head { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 1.25rem 0 .5rem; }
  .rt-total { font-size: 1.3rem; font-weight: 700; margin: 1rem 0; }
  .note { color: var(--muted); font-size: .85rem; }
  .banner { background: var(--warn-bg); border: 1px solid var(--warn);
            color: var(--warn); border-radius: 8px; padding: .75rem 1rem; margin-bottom: 1.5rem; }
  #results { margin-top: 2rem; }
</style>
</head>
<body>
<main>
  <h1>tripps</h1>
  <p class="tagline">The cheapest way from A to B in Sweden — train, bus, flight, and free Hertz Freerider cars, combined.</p>

  {% if errors %}
    <div class="banner">
      {% for e in errors %}<div>{{ e }}</div>{% endfor %}
    </div>
  {% endif %}

  <form id="search" method="post" action="/search">
    <div>
      <label for="origin">From</label>
      <input type="text" id="origin" name="origin" required placeholder="Stockholm C"
             autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list">
      <ul class="suggest" id="origin-suggest" role="listbox" hidden></ul>
    </div>
    <div>
      <label for="destination">To</label>
      <input type="text" id="destination" name="destination" required placeholder="Göteborg C"
             autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list">
      <ul class="suggest" id="destination-suggest" role="listbox" hidden></ul>
    </div>
    <div>
      <label for="date">Date</label>
      <input type="date" id="date" name="date" value="{{ today }}" required>
    </div>
    <div>
      <label for="return_date">Return <span class="opt">(optional)</span></label>
      <input type="date" id="return_date" name="return_date">
    </div>
    <div>
      <label for="earliest">Leave after</label>
      <input type="time" id="earliest" name="earliest" value="06:00">
    </div>
    <div>
      <label for="max_hours">Max hours</label>
      <input type="number" id="max_hours" name="max_hours" min="1" max="48" step="0.5" placeholder="any">
    </div>
    <div>
      <label for="max_transfers">Max transfers</label>
      <input type="number" id="max_transfers" name="max_transfers" min="0" max="5" placeholder="any">
    </div>

    <div class="full checks">
      <span class="checks-label">Travel by</span>
      <label><input type="checkbox" name="mode_train" checked> Train</label>
      <label><input type="checkbox" name="mode_bus" checked> Bus</label>
      <label><input type="checkbox" name="mode_ferry" checked> Ferry</label>
      <label><input type="checkbox" name="mode_freerider" checked> Freerider <span class="opt">({{ freerider_count }} cars)</span></label>
      <label><input type="checkbox" name="mode_flight"> Flight <span class="opt">(slow)</span></label>
    </div>

    <div class="full">
      <button type="submit" id="go">Find the cheapest</button>
      <button type="button" id="fares" class="secondary">Cheapest day (next 7)</button>
      <span class="note" id="status"></span>
    </div>
  </form>

  <div id="results"></div>
</main>

<script>
  const form = document.getElementById("search");
  const results = document.getElementById("results");
  const button = document.getElementById("go");
  const status = document.getElementById("status");

  // --- station autocomplete -------------------------------------------
  // Backed by /api/stops, which resolves free text against the real timetable, so a user
  // types "Stock" and picks the exact station id the router expects instead of guessing.
  function attachAutocomplete(inputId, listId) {
    const input = document.getElementById(inputId);
    const list = document.getElementById(listId);
    let items = [];
    let active = -1;
    let seq = 0;

    const close = () => {
      list.hidden = true; list.innerHTML = ""; active = -1;
      input.setAttribute("aria-expanded", "false");
    };

    const render = () => {
      list.innerHTML = "";
      items.forEach((name, i) => {
        const li = document.createElement("li");
        li.textContent = name;
        li.setAttribute("role", "option");
        li.setAttribute("aria-selected", i === active ? "true" : "false");
        li.addEventListener("mousedown", (e) => { e.preventDefault(); choose(i); });
        list.appendChild(li);
      });
      list.hidden = items.length === 0;
      input.setAttribute("aria-expanded", items.length ? "true" : "false");
    };

    const choose = (i) => {
      if (i < 0 || i >= items.length) return;
      input.value = items[i];
      close();
    };

    let timer = null;
    input.addEventListener("input", () => {
      const q = input.value.trim();
      clearTimeout(timer);
      if (q.length < 2) { close(); return; }
      timer = setTimeout(async () => {
        const mine = ++seq;
        try {
          const res = await fetch("/api/stops?q=" + encodeURIComponent(q));
          if (!res.ok) return;
          const data = await res.json();
          if (mine !== seq) return; // a newer keystroke already fired
          items = data.map((s) => s.name);
          active = -1;
          render();
        } catch (_) { /* offline: no suggestions, typing still works */ }
      }, 140);
    });

    input.addEventListener("keydown", (e) => {
      if (list.hidden) return;
      if (e.key === "ArrowDown") { e.preventDefault(); active = Math.min(active + 1, items.length - 1); render(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(active - 1, 0); render(); }
      else if (e.key === "Enter" && active >= 0) { e.preventDefault(); choose(active); }
      else if (e.key === "Escape") { close(); }
    });

    input.addEventListener("blur", () => setTimeout(close, 120));
  }

  attachAutocomplete("origin", "origin-suggest");
  attachAutocomplete("destination", "destination-suggest");

  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function modeParams() {
    // local_transit is always allowed (feeder legs); the checkboxes pick the travel modes.
    const modes = ["local_transit"];
    if (form.mode_train.checked) modes.push("train");
    if (form.mode_bus.checked) modes.push("bus");
    if (form.mode_ferry.checked) modes.push("ferry");
    if (form.mode_freerider.checked) modes.push("freerider");
    if (form.mode_flight.checked) modes.push("flight");
    const p = new URLSearchParams();
    p.set("origin", form.origin.value);
    p.set("destination", form.destination.value);
    modes.forEach(m => p.append("modes", m));
    p.set("include_freerider", form.mode_freerider.checked);
    if (form.max_hours.value) p.set("max_hours", form.max_hours.value);
    if (form.max_transfers.value) p.set("max_transfers", form.max_transfers.value);
    return p;
  }

  function legRows(itin) {
    return itin.legs.filter(l => l.mode !== "walk").map(l => {
      const cost = l.quote && l.quote.amount_ore != null
        ? (l.quote.amount_ore === 0 ? "free" : Math.round(l.quote.amount_ore / 100) + " SEK") : "no price";
      const book = l.quote && l.quote.deeplink
        ? ` · <a class="book" href="${esc(l.quote.deeplink)}" target="_blank" rel="noopener noreferrer">book →</a>` : "";
      const op = l.operator ? ` <span class="meta">(${esc(l.operator)})</span>` : "";
      return `<li>${l.departure.slice(11,16)}–${l.arrival.slice(11,16)} <b>${esc(l.mode)}</b>${op} `
        + `${esc(l.from_stop.name)} → ${esc(l.to_stop.name)} · ${cost}${book}</li>`;
    }).join("");
  }

  function renderItinerary(itin) {
    const price = itin.total_price_sek != null
      ? Math.round(itin.total_price_sek) + " SEK" : "price unavailable";
    return `<div class="itin"><div class="head"><span class="price">${price}</span> `
      + `<span class="meta">${itin.departure.slice(11,16)}→${itin.arrival.slice(11,16)}</span></div>`
      + `<ul class="legs">${legRows(itin)}</ul></div>`;
  }

  function renderResponse(resp) {
    if (!resp.itineraries || !resp.itineraries.length) return '<p class="empty">No priced journey found.</p>';
    const warn = (resp.warnings && resp.warnings.length)
      ? '<div class="warnbox"><ul>' + resp.warnings.map(w => "<li>" + esc(w) + "</li>").join("") + "</ul></div>" : "";
    return warn + resp.itineraries.map(renderItinerary).join("");
  }

  async function runJson(url) {
    button.disabled = true;
    document.getElementById("fares").disabled = true;
    results.innerHTML = "";
    try {
      const res = await fetch(url);
      if (!res.ok) { results.innerHTML = '<p class="banner">' + esc((await res.json()).detail || res.status) + "</p>"; return null; }
      return await res.json();
    } catch (err) {
      results.innerHTML = '<p class="banner">Request failed: ' + esc(err) + "</p>";
      return null;
    } finally {
      button.disabled = false;
      document.getElementById("fares").disabled = false;
      status.textContent = "";
    }
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const returnDate = form.return_date.value;
    if (returnDate) {
      status.textContent = "Pricing both directions…";
      const p = modeParams();
      p.set("date", form.date.value);
      p.set("return", returnDate);
      const data = await runJson("/api/round-trip?" + p.toString());
      if (!data) return;
      const total = data.total_price_sek != null
        ? `<div class="rt-total">Round-trip total: ${Math.round(data.total_price_sek)} SEK</div>` : "";
      results.innerHTML = total
        + `<div class="rt-head">Outbound · ${form.date.value}</div>` + renderResponse(data.outbound)
        + `<div class="rt-head">Return · ${returnDate}</div>` + renderResponse(data.inbound);
      return;
    }
    button.disabled = true;
    status.textContent = "Routing, then pricing the survivors…";
    results.innerHTML = "";
    try {
      const response = await fetch("/search", { method: "POST", body: new FormData(form) });
      results.innerHTML = await response.text();
    } catch (err) {
      results.innerHTML = '<p class="banner">Search failed: ' + esc(err) + "</p>";
    } finally {
      button.disabled = false;
      status.textContent = "";
    }
  });

  document.getElementById("fares").addEventListener("click", async () => {
    status.textContent = "Pricing each of the next 7 days… (first run is slow)";
    const p = modeParams();
    p.set("start", form.date.value);
    p.set("days", "7");
    const data = await runJson("/api/fares?" + p.toString());
    if (!data) return;
    const best = data.cheapest ? data.cheapest.date : null;
    const cells = data.days.map((d, i) => {
      const price = d.price_sek != null ? Math.round(d.price_sek) + " SEK" : "—";
      const dt = new Date(d.date + "T00:00");
      const label = dt.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
      const modes = (d.modes || []).join("+");
      const cls = d.itinerary ? `fare-day${d.date === best ? " best" : ""}` : "fare-day disabled";
      return `<div class="${cls}" data-day="${i}"${d.itinerary ? ' role="button" tabindex="0"' : ""}>`
        + `<div class="d">${label}</div><div class="p">${price}</div><div class="m">${esc(modes)}</div>`
        + `<div class="hint">${d.itinerary ? "tap for legs & booking" : ""}</div></div>`;
    }).join("");
    results.innerHTML = `<div class="rt-head">Cheapest day · ${esc(form.origin.value)} → ${esc(form.destination.value)} `
      + `<span class="opt">(tap a day to see the journey)</span></div>`
      + `<div class="fare-cal">${cells}</div><div id="fare-detail"></div>`;

    const detail = document.getElementById("fare-detail");
    const openDay = (i) => {
      const d = data.days[i];
      if (!d || !d.itinerary) return;
      [...results.querySelectorAll(".fare-day")].forEach(c => c.classList.toggle("open", c.dataset.day === String(i)));
      const dt = new Date(d.date + "T00:00").toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
      detail.innerHTML = `<div class="rt-head">${esc(dt)} · ${Math.round(d.price_sek)} SEK</div>` + renderItinerary(d.itinerary);
      detail.scrollIntoView({ behavior: "smooth", block: "nearest" });
    };
    results.querySelectorAll(".fare-day[role=button]").forEach(card => {
      card.addEventListener("click", () => openDay(Number(card.dataset.day)));
      card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDay(Number(card.dataset.day)); } });
    });
  });
</script>
</body>
</html>
