[project]
name = "tripps"
version = "0.1.0"
description = "Cheapest multimodal travel routing within Sweden (train, bus, flight, Hertz Freerider)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
flights = ["fast-flights>=2.2"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[project.scripts]
tripps = "tripps.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:tripps.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    # `str, Enum` is deliberate: pydantic serializes these members as their string value,
    # and they cross the JSON boundary in every API response.
    "UP042",
    # FastAPI's dependency system requires `Query(...)`/`Form(...)` in argument defaults.
    "B008",
    # `PriceAdapter.aclose` is an optional hook with a working no-op default, not an
    # abstract method every adapter must implement.
    "B027",
]
